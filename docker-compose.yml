# 環境ごとの値は .env に置く（.env.example をコピーして作る）。
# ここには実際のIPアドレス等をハードコードしないこと。
x-image-env: &image-env
  IMAGES_DIR: /data/images          # 永続保存（削除しない）
  CACHE_DIR: /data/cache            # 表示用キャッシュ（自動/手動削除）
  PERSIST_CATEGORIES: "${PERSIST_CATEGORIES:-}"      # 永続対象カテゴリ（カンマ区切り）
  CACHE_RETENTION_DAYS: "${CACHE_RETENTION_DAYS:-30}"  # キャッシュ自動削除の閾値（日）

# IG取得ワーカーの共通設定。
# **X側のワーカーとはイメージも環境変数も別系統。**
# proxy は worker 系にだけ入れる（web はローカルのファイルを返すだけで外に出ない）。
# 入れ忘れたコンテナは IPv6 で分離をすり抜けるので、足したら必ず
# `docker compose run --rm ig-ipcheck` で出口IPを確認すること。
x-ig-worker-base: &ig-worker-base
  build:
    context: .
    dockerfile: Dockerfile.ig-worker
  image: x-ray-ig-worker:latest
  # /data はホスト側と共有するので母艦のユーザーに合わせる
  user: "${IG_RAY_UID:-1000}:${IG_RAY_GID:-1000}"
  volumes:
    # IG-Ray のデータ領域をそのまま使う。取得側はここに書き、
    # X-Ray の web は同じ場所を /ig-data に読み取り専用の作法で読む。
    - "${IG_RAY_DATA_DIR:-./data/ig-ray-empty}:/data"
  environment:
    IG_RAY_DB: "${IG_RAY_DB:-}"
    IG_RAY_SESSIONS: /data/sessions
    IG_RAY_CACHE: /data/cache
    IG_RAY_LOGIN_USER: "${IG_RAY_LOGIN_USER:-}"
    IG_RAY_DOWNLOAD_VIDEOS: "${IG_RAY_DOWNLOAD_VIDEOS:-0}"
    IG_RAY_SLEEP_MIN: "${IG_RAY_SLEEP_MIN:-3}"
    IG_RAY_SLEEP_MAX: "${IG_RAY_SLEEP_MAX:-8}"
    IG_RAY_MAX_SLEEP: "${IG_RAY_MAX_SLEEP:-60}"
    IG_RAY_POSTS_ONLY: "${IG_RAY_POSTS_ONLY:-0}"
    IG_RAY_FETCH_LOCATION: "${IG_RAY_FETCH_LOCATION:-0}"
    IG_RAY_VIDEO_URL_PROBE: "${IG_RAY_VIDEO_URL_PROBE:-0}"
    IG_RAY_BUSY_TIMEOUT_MS: "${IG_RAY_BUSY_TIMEOUT_MS:-60000}"
    # IG側のキャッシュ保持期間。渡し忘れると .env に書いても既定のまま黙って動く
    IG_RAY_CACHE_RETENTION_DAYS: "${IG_RAY_CACHE_RETENTION_DAYS:-30}"
    # --- 全件バックフィル ---
    IG_RAY_BACKFILL_PAGE_SLEEP_MIN: "${IG_RAY_BACKFILL_PAGE_SLEEP_MIN:-600}"
    IG_RAY_BACKFILL_PAGE_SLEEP_MAX: "${IG_RAY_BACKFILL_PAGE_SLEEP_MAX:-1200}"
    IG_RAY_BACKFILL_KNOWN_STREAK: "${IG_RAY_BACKFILL_KNOWN_STREAK:-30}"
    IG_RAY_BACKFILL_QUIET_SEC: "${IG_RAY_BACKFILL_QUIET_SEC:-180}"
    IG_RAY_BACKFILL_RATELIMIT_BACKOFF: "${IG_RAY_BACKFILL_RATELIMIT_BACKOFF:-3600}"
    IG_RAY_BACKFILL_IDLE_SLEEP: "${IG_RAY_BACKFILL_IDLE_SLEEP:-300}"
    # ログイン検証が続けて失敗したときの再挑戦間隔の上限（秒）
    IG_RAY_LOGIN_BACKOFF_MAX: "${IG_RAY_LOGIN_BACKOFF_MAX:-86400}"
    IG_RAY_PROXY: "${IG_RAY_PROXY:-}"
    # --- 出口の分離（別回線側のプロキシ経由で出す） ---
    # **X側と同じ PROXY_URL を使う。** IG-Ray では HTTP_PROXY という別名で
    # 持っていたが、同じプロキシを2つの名前で指すと、回線のIPが変わったときに
    # 片方だけ直して分離が崩れる（実際にIPは一度変わっている）。
    HTTP_PROXY: "${PROXY_URL:-}"
    HTTPS_PROXY: "${PROXY_URL:-}"
    http_proxy: "${PROXY_URL:-}"
    https_proxy: "${PROXY_URL:-}"
    NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    no_proxy: "${NO_PROXY:-localhost,127.0.0.1}"
    # 期待する出口IPも同じ理由で X側の設定に寄せる。
    # IG だけ別の回線から出したいときだけ IG_RAY_EXPECT_EGRESS_IP を書く。
    IG_RAY_EXPECT_EGRESS_IP: "${IG_RAY_EXPECT_EGRESS_IP:-${EXPECTED_EGRESS_IP:-}}"
    # ig-cron のシェルが読む
    IG_RAY_INTERVAL: "${IG_RAY_INTERVAL:-21600}"
    IG_RAY_CRON_LIMIT: "${IG_RAY_CRON_LIMIT:-6}"
    TZ: "${TZ:-Asia/Tokyo}"
  restart: "no"

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: x-ray-worker
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      <<: *image-env
      DB_PATH: /data/data.db
      TWITTER_ACCOUNTS_FILE: /data/accounts.txt
      TWITTER_COOKIES_FILE: /data/cookies.txt
      ACCOUNTS_JSON_PATH: /data/accounts.json
      TWSCRAPE_DB: /data/accounts_pool.db   # twscrapeのXアカウントプール（再ビルドで消えないよう永続化）
      SAVE_IMAGES: "1"
      TWEETS_PER_USER: "${TWEETS_PER_USER:-10}"
      SCRAPE_LOG_RETENTION_DAYS: "${SCRAPE_LOG_RETENTION_DAYS:-7}"
      TWS_HTTP_BACKEND: curl

      # --- スクレイピングの出口を専用回線に分離する場合 ---
      # PROXY_URL が空なら素通し。curl-cffi（twscrape）も urllib（画像DL）も
      # 標準のproxy環境変数を尊重する。大文字・小文字の両方を入れておく。
      HTTP_PROXY: "${PROXY_URL:-}"
      HTTPS_PROXY: "${PROXY_URL:-}"
      http_proxy: "${PROXY_URL:-}"
      https_proxy: "${PROXY_URL:-}"
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      TWS_PROXY: "${PROXY_URL:-}"           # twscrape専用。環境変数が効かない場合の保険
      EXPECTED_EGRESS_IP: "${EXPECTED_EGRESS_IP:-}"  # 出口IPの自動照合（空なら照合しない）

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: x-ray-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8501}:5000"
    volumes:
      - ./data:/data
      # IG-Ray のアーカイブ。**読み取り専用(:ro)にしないこと。**
      # SQLite の WAL は読むだけでも -shm を作る必要があり、ig-ray が
      # -wal を残したまま落ちていると :ro では開けずタイムラインごと落ちる。
      # 書き込みは app/ig_bridge.py が PRAGMA query_only で禁じている。
      - "${IG_RAY_DATA_DIR:-./data/ig-ray-empty}:/ig-data"
    environment:
      <<: *image-env
      DB_PATH: /data/data.db
      # IG-Ray 統合。空にすると統合そのものが無効になる。
      IG_DB_PATH: "${IG_DB_PATH:-}"
      IG_CACHE_DIR: "${IG_CACHE_DIR:-/ig-data/cache}"
      TWITTER_COOKIES_FILE: /data/cookies.txt
      ACCOUNTS_JSON_PATH: /data/accounts.json
      # Tumblr共有（/share を外部公開する場合のみ設定）
      PUBLIC_SHARE_BASE_URL: "${PUBLIC_SHARE_BASE_URL:-}"
      PUBLIC_SHARE_HOST: "${PUBLIC_SHARE_HOST:-}"
      # Tumblr直接投稿（設定するとトンネル不要）
      TUMBLR_CONSUMER_KEY: "${TUMBLR_CONSUMER_KEY:-}"
      TUMBLR_CONSUMER_SECRET: "${TUMBLR_CONSUMER_SECRET:-}"
      TUMBLR_ACCOUNTS_FILE: "${TUMBLR_ACCOUNTS_FILE:-/data/tumblr_accounts.json}"
      TUMBLR_TAG_MAP: "${TUMBLR_TAG_MAP:-}"
      # 画面右上に出すバージョン表記の上書き（空ならコード側の既定値）
      APP_VERSION: "${APP_VERSION:-}"
      # 取得が止まっていないかの見張り（時間）。0で無効
      SCRAPE_STALE_HOURS: "${SCRAPE_STALE_HOURS:-3}"
      # IG側の見張り。巡回間隔の何倍で異常とみなすか（IG_RAY_INTERVAL の倍数）
      IG_RAY_INTERVAL: "${IG_RAY_INTERVAL:-21600}"
      IG_RAY_STALE_INTERVALS: "${IG_RAY_STALE_INTERVALS:-3}"
      TUMBLR_DRAFT_THRESHOLD: "${TUMBLR_DRAFT_THRESHOLD:-3}"
      SHARE_TOKEN_TTL_MIN: "${SHARE_TOKEN_TTL_MIN:-60}"
    # web はスクレイピングしないのでproxyは設定しない
    depends_on:
      - worker

  # ==========================================================================
  # IG取得（IG-Ray から持ち込み）
  # ==========================================================================
  #
  # **既定では何も常駐しない。** IGは叩きすぎると即ブロックされるので、
  # `docker compose up` で勝手に取得が始まらないようにしてある。
  #
  #   # profile 付きのサービスは素の build ではビルドされない。
  #   # 「app/ を直したのに挙動が変わらない」の原因になるので必ず profile 付きで。
  #   docker compose --profile ig-cron --profile ig-tools --profile ig-backfill build
  #
  #   docker compose run --rm ig-import-cookies   # セッション取り込み
  #   docker compose run --rm ig-ipcheck          # 出口IPの確認
  #   docker compose run --rm ig-accounts list    # 監視対象の管理
  #   docker compose run --rm ig-scrape ユーザー名 --limit 3 --no-media
  #   docker compose --profile ig-cron up -d      # 定期巡回を有効化
  #
  # X側のワーカーとはイメージを分けている（Dockerfile.ig-worker の冒頭参照）。

  ig-login:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "make_session.py"]
    command: []
    stdin_open: true
    tty: true

  # ブラウザのクッキーからセッションを作る。
  # **entrypoint 方式にすること。** command: で書くと引数を足したときに
  # コマンドごと置き換わり、tini が引数をプログラムとして実行して落ちる。
  ig-import-cookies:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "import_cookies.py"]
    command: []
    stdin_open: true
    tty: true

  ig-ipcheck:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "check_egress.py"]
    command: []

  ig-diag:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    volumes:
      - "${IG_RAY_DATA_DIR:-./data/ig-ray-empty}:/data"
      - ./ig/dev:/dev-scripts:ro
      - ./ig/tools:/ig-tools:ro
    entrypoint: ["/usr/bin/tini", "--", "python", "/ig-tools/diag_session.py"]
    command: []

  ig-probe:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    volumes:
      - "${IG_RAY_DATA_DIR:-./data/ig-ray-empty}:/data"
      - ./ig/dev:/dev-scripts:ro
    entrypoint: ["/usr/bin/tini", "--", "python", "/dev-scripts/probe_posts.py"]
    command: []

  ig-accounts:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "seed_accounts.py"]
    command: []

  ig-scrape:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "ig_scraper.py"]
    command: []

  ig-backfill:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "python", "backfill.py"]
    command: []

  # 全件バックフィルの常駐ワーカー。
  # イテレータを生かしたまま常駐させるのが肝で、「1ページ取って終了、
  # 次回 thaw で再開」にすると NodeIterator が毎回1ページ目を取り直して
  # リクエストが倍増する。cron と同時に動いてよい（巡回中は待つ）。
  ig-backfill-worker:
    <<: *ig-worker-base
    profiles: ["ig-backfill"]
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "python", "backfill.py", "run"]
    command: []

  ig-shell:
    <<: *ig-worker-base
    profiles: ["ig-tools"]
    entrypoint: ["/usr/bin/tini", "--", "bash"]
    command: []
    stdin_open: true
    tty: true

  # IGの定期巡回。既定で無効。有効化は docker compose --profile ig-cron up -d
  #
  # IGはブロックされやすいので間隔は最低でも数時間空けること。
  # 3時間に縮めても新規はほとんど増えず機械的なパターンになるだけなので、
  # 取りこぼし対策なら IG_RAY_CRON_LIMIT を上げるほうが安全。
  ig-cron:
    <<: *ig-worker-base
    profiles: ["ig-cron"]
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "bash", "-c"]
    # $$ は compose の変数展開を抜けてシェルに渡すためのエスケープ。
    # $ 一つだと compose が自分の変数として空文字に置換してしまう。
    command:
      - |
        INTERVAL="$${IG_RAY_INTERVAL:-21600}"
        LIMIT="$${IG_RAY_CRON_LIMIT:-6}"
        echo "IG巡回モード: $${INTERVAL}秒ごと / 1アカウント $${LIMIT}件"
        while true; do
          echo "--- $$(date -Iseconds) ---"
          python ig_scraper.py --cron --limit "$$LIMIT" || \
            echo "失敗しました。scrape_log を確認してください。"
          sleep "$$INTERVAL"
        done
