# Cloudflare Tunnel の設定例。
# /share と /share-img だけを外部公開し、他は 404 に落とす。
#
# 注意: path は「1ルール1パターン」で書くこと。
# `^/share(-img)?/.*` のようにまとめて書くとマッチせず全部404になる。

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # 共有ページ
  - hostname: share.example.com
    path: /share/.*
    service: http://localhost:8501

  # 共有画像（Tumblrがog:imageを取りに来る）
  - hostname: share.example.com
    path: /share-img/.*
    service: http://localhost:8501

  # それ以外は404。X-Ray本体（/manage 等）には到達させない
  - hostname: share.example.com
    service: http_status:404

  # 他のホスト名も全部拒否
  - service: http_status:404

# --- path でハマる場合 ---
# X-Ray側にも PUBLIC_SHARE_HOST による制限があり、公開ホスト名宛の
# /share 系以外のリクエストは web が404を返す（二層目の防御）。
# そのため path 指定を諦めて下記のように全通しにしても、本体は保護される。
#
# ingress:
#   - hostname: share.example.com
#     service: http://localhost:8501
#   - service: http_status:404
