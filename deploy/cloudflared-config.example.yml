# Cloudflare Tunnel の設定例。
# /share と /share-img だけを外部公開し、他は 404 に落とす。
#
# 前提:
#   - Cloudflareでドメイン取得済み
#   - `cloudflared tunnel login` 済み
#   - `cloudflared tunnel create x-ray-share` でトンネル作成済み
#     → 発行された <TUNNEL_ID> と認証情報ファイルのパスを下に反映する

tunnel: <TUNNEL_ID>
credentials-file: /home/<user>/.cloudflared/<TUNNEL_ID>.json

ingress:
  # 共有ページと共有画像だけ X-Ray web に流す
  - hostname: share.example.com
    path: ^/share(-img)?/.*
    service: http://localhost:8501

  # それ以外は全部 404。X-Ray本体（/manage 等）には到達させない
  - hostname: share.example.com
    service: http_status:404

  # 他のホスト名も全部拒否
  - service: http_status:404
